name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control_centre/backend/requirements.txt

      - name: Install dependencies
        working-directory: control_centre/backend
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner fast; vision tests skip gracefully
          # if a model cannot load.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: control_centre/backend
        run: python -m pytest -q

  frontend:
    name: Frontend tests + build (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: control_centre/frontend/package-lock.json

      - name: Install dependencies
        working-directory: control_centre/frontend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: control_centre/frontend
        run: npm test

      - name: Production build
        working-directory: control_centre/frontend
        env:
          VITE_WS_PATH: /ws
        run: npm run build
