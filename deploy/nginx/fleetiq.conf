# FLEET-IQ Rapid Transit — single-host deployment.
# Serves the built SPA, proxies the REST API, and proxies both WebSockets on
# 443 so no high ports need to be open in the firewall.
#
# Install: copy to /etc/nginx/sites-available/fleetiq, symlink into
# sites-enabled, then `certbot --nginx -d <your-domain>` for HTTPS.

upstream fleetiq_api {
    server 127.0.0.1:5001;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot rewrites this block when HTTPS is enabled.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ssl_certificate / ssl_certificate_key are added by certbot.

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/fleetiq/frontend/dist;
    index index.html;

    # Hashed build assets are immutable; index.html must never be cached or
    # judges get a stale bundle after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://fleetiq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Camera frames (backend :8766). Declared before /ws so the longer prefix
    # is matched first regardless of order.
    location /ws/camera {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Bus telemetry + dashboard alerts (backend :8765)
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Client-side routing: every other path serves the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
